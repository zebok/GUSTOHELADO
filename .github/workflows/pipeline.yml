name: Data Pipeline & Deploy

on:
  push:
    branches:
      - main
  schedule:
    # Corre todos los viernes a las 23:00 UTC (20:00 ART)
    - cron: '0 23 * * 5'
  workflow_dispatch: # Permite ejecución manual desde GitHub

jobs:
  update-data:
    name: ETL — Actualizar datos desde Google Sheets
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Necesario para que el bot pueda hacer git push

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r data_pipeline/requirements.txt

      - name: Correr pipeline ETL
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python data_pipeline/process_data.py

      - name: Commitear datos actualizados
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/heladerias_prod.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: actualizar datos de producción" && git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:main)

  build-and-deploy:
    name: Build — Compilar y desplegar frontend
    runs-on: ubuntu-latest
    needs: update-data

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          ref: main # Asegura que toma el commit con los datos actualizados

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias Node
        run: npm ci

      - name: Build de la aplicación
        run: npm run build

      # Despliegue: Vercel y Netlify se conectan directamente al repo
      # y redesplacan automáticamente al detectar un push en main.
      # Si usás GitHub Pages, descomenta el paso de abajo:
      #
      # - name: Deploy a GitHub Pages
      #   uses: peaceiris/actions-gh-pages@v4
      #   with:
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     publish_dir: ./dist
