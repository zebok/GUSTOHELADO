name: Data Pipeline & Deploy

on:
  push:
    branches:
      - main
  schedule:
    # Corre todos los viernes a las 23:00 UTC
    - cron: '0 23 * * 5'
  workflow_dispatch: # Permite ejecución manual

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r data_pipeline/requirements.txt

      - name: Run ETL Pipeline (Prod)
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python data_pipeline/process_data.py --mode prod

      - name: Commit Production Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/heladerias_prod.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: autoupdate production data" && git push)

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Deploy to Vercel (or Github Pages)
        # Puedes reemplazar esto por la acción oficial de Vercel, Netlify o GitHub Pages.
        # Por defecto, Vercel o Netlify se pueden conectar directamente al repositorio de GitHub
        # de forma gratuita y redesplegar al detectar un push en la rama main.
        run: echo "Despliegue ejecutado con éxito."
